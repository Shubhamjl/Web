<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Catalogue</title>

    <style>
        /* General Page Styling */
        body {
            font-family: Arial, sans-serif;
            background:white;
            color: #333;
            text-align: center;
            margin: 20px;
            padding: 20px;
        }

        /* Title Styling */
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            font-weight: bold;
            color: #000000;
            font-family: 'Courier New', Courier, monospace;
           
        }

        /* Table Styling */
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f803fc;
            color: white;
            font-size: 18px;
        }

        td {
            font-size: 16px;
        }

        /* Alternate Row Colors */
        tbody tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tbody tr:hover {
            background-color: #cce5ff;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            table {
                width: 100%;
            }
            th, td {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <h2>Book Catalogue</h2>

    <table>
        <thead>
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Price ($)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>The Great Gatsby</td>
                <td>F. Scott Fitzgerald</td>
                <td>10.99</td>
            </tr>
            <tr>
                <td>102</td>
                <td>1984</td>
                <td>George Orwell</td>
                <td>8.99</td>
            </tr>
            <tr>
                <td>103</td>
                <td>To Kill a Mockingbird</td>
                <td>Harper Lee</td>
                <td>12.50</td>
            </tr>
            <tr>
                <td>104</td>
                <td>The Hobbit</td>
                <td>J.R.R. Tolkien</td>
                <td>9.99</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
