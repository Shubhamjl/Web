<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eskishya - Home</title>

    <style>
        /* General Header Styling */
        .header {
            background-color: white;
            padding: 10px 20px;
            border-bottom: 2px solid #ddd;
            box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: auto;
        }

        /* Logo Styling */
        .logo img {
            width: 150px;
            height: auto;
        }

        /* Navigation Links */
        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #007bff;
        }

        /* Underline Effect on Hover */
        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 100%;
            height: 2px;
            background-color: #007bff;
            transform: scaleX(0);
            transition: transform 0.3s ease-in-out;
        }

        .nav-links a:hover::after {
            transform: scaleX(1);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: center;
            }

            .nav-links {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <!-- Logo -->
            <div class="logo">
                <img src="Assest/text-1745739779972.png" alt="Logo">
            </div>

            <ul class="nav-links">
                <li><a href="content.html" target="contentFrame">Home</a></li>
                <li><a href="catalogue.html" target="contentFrame">Catalogue</a></li>
                <li><a href="register.html" target="contentFrame">Register</a></li>
                <li><a href="login.html" target="contentFrame">Login</a></li>
            </ul>
        </nav>
    </header>
</body>
</html>
